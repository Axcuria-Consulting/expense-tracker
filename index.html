<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>経費記録</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 0; padding: 20px; background: #f4f6f8; color: #222; }
  .container { max-width: 720px; margin: 0 auto; background: #fff;
               padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  h1 { margin-top: 0; font-size: 22px; }
  label { display: block; margin-top: 12px; font-size: 14px; font-weight: 600; }
  input, textarea, select { width: 100%; padding: 10px; margin-top: 4px;
         border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { margin-top: 16px; padding: 10px 18px; background: #2563eb;
           color: #fff; border: none; border-radius: 6px; font-size: 14px;
           cursor: pointer; }
  button.secondary { background: #6b7280; margin-left: 8px; }
  button:hover { opacity: 0.9; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
  th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
  th { background: #f9fafb; }
  .hidden { display: none; }
  .error { color: #dc2626; font-size: 13px; margin-top: 8px; }
  .actions { margin-top: 16px; }
</style>
</head>
<body>

<div id="loginScreen" class="container">
  <h1>🔒 経費記録システム</h1>
  <p>パスワードを入力してください。</p>
  <label>パスワード
    <input type="password" id="passwordInput" autofocus>
  </label>
  <button onclick="checkPassword()">ログイン</button>
  <div id="loginError" class="error"></div>
</div>

<div id="mainScreen" class="container hidden">
  <h1>📒 経費を記録</h1>
  <label>入力者名 <input type="text" id="userName" placeholder="例: 山田太郎"></label>
  <label>日付 <input type="date" id="date"></label>
  <label>項目
    <select id="category">
      <option>交通費</option>
      <option>飲食費</option>
      <option>消耗品</option>
      <option>会議費</option>
      <option>その他</option>
    </select>
  </label>
  <label>金額 (円) <input type="number" id="amount" min="0"></label>
  <label>メモ <textarea id="memo" rows="2"></textarea></label>
  <div class="actions">
    <button onclick="addExpense()">記録する</button>
    <button class="secondary" onclick="exportCSV()">CSVダウンロード</button>
    <button class="secondary" onclick="logout()">ログアウト</button>
  </div>

  <h2 style="margin-top:30px;font-size:18px;">記録一覧</h2>
  <table id="expenseTable">
    <thead>
      <tr><th>日付</th><th>入力者</th><th>項目</th><th>金額</th><th>メモ</th><th></th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
  const PASSWORD = "keihi";

  function checkPassword() {
    const input = document.getElementById('passwordInput').value;
    if (input === PASSWORD) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
      sessionStorage.setItem('auth', '1');
      renderTable();
    } else {
      document.getElementById('loginError').textContent = 'パスワードが違います。';
    }
  }

  function logout() {
    sessionStorage.removeItem('auth');
    location.reload();
  }

  function getData() {
    return JSON.parse(localStorage.getItem('expenses') || '[]');
  }

  function saveData(data) {
    localStorage.setItem('expenses', JSON.stringify(data));
  }

  function addExpense() {
    const name = document.getElementById('userName').value.trim();
    const date = document.getElementById('date').value;
    const category = document.getElementById('category').value;
    const amount = document.getElementById('amount').value;
    const memo = document.getElementById('memo').value.trim();

    if (!name || !date || !amount) {
      alert('入力者名・日付・金額は必須です。');
      return;
    }

    const data = getData();
    data.push({ name, date, category, amount, memo, ts: Date.now() });
    saveData(data);

    document.getElementById('amount').value = '';
    document.getElementById('memo').value = '';
    renderTable();
  }

  function deleteExpense(ts) {
    if (!confirm('削除しますか？')) return;
    const data = getData().filter(e => e.ts !== ts);
    saveData(data);
    renderTable();
  }

  function renderTable() {
    const tbody = document.querySelector('#expenseTable tbody');
    const data = getData().sort((a,b) => b.ts - a.ts);
    tbody.innerHTML = data.map(e => `
      <tr>
        <td>${e.date}</td>
        <td>${escapeHtml(e.name)}</td>
        <td>${e.category}</td>
        <td>¥${Number(e.amount).toLocaleString()}</td>
        <td>${escapeHtml(e.memo)}</td>
        <td><button class="secondary" onclick="deleteExpense(${e.ts})">削除</button></td>
      </tr>`).join('');
  }

  function escapeHtml(s) {
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function exportCSV() {
    const data = getData();
    const header = ['日付','入力者','項目','金額','メモ'];
    const rows = data.map(e => [e.date, e.name, e.category, e.amount, e.memo]);
    const csv = [header, ...rows].map(r =>
      r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'expenses.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  if (sessionStorage.getItem('auth') === '1') {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainScreen').classList.remove('hidden');
    renderTable();
  }
  document.getElementById('passwordInput')?.addEventListener('keypress', e => {
    if (e.key === 'Enter') checkPassword();
  });
</script>
</body>
</html>
