<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>経費記録</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 0; padding: 20px; background: #f4f6f8; color: #222; }
  .container { max-width: 720px; margin: 0 auto; background: #fff;
               padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  h1 { margin-top: 0; font-size: 22px; }
  label { display: block; margin-top: 12px; font-size: 14px; font-weight: 600; }
  input, textarea, select { width: 100%; padding: 10px; margin-top: 4px;
         border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { margin-top: 16px; padding: 10px 18px; background: #2563eb;
           color: #fff; border: none; border-radius: 6px; font-size: 14px;
           cursor: pointer; }
  button.secondary { background: #6b7280; margin-left: 8px; }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .hidden { display: none; }
  .error { color: #dc2626; font-size: 13px; margin-top: 8px; }
  .success { color: #16a34a; font-size: 14px; margin-top: 12px; font-weight: 600; }
  .actions { margin-top: 16px; }
  .note { font-size: 12px; color: #6b7280; margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>

<!-- パスワード画面 -->
<div id="loginScreen" class="container">
  <h1>🔒 経費記録システム</h1>
  <p>パスワードを入力してください。</p>
  <label>パスワード
    <input type="password" id="passwordInput" autofocus>
  </label>
  <button onclick="checkPassword()">ログイン</button>
  <div id="loginError" class="error"></div>
</div>

<!-- メイン画面 -->
<div id="mainScreen" class="container hidden">
  <h1>📒 経費を記録</h1>
  <label>入力者名 <input type="text" id="userName" placeholder="例: 山田太郎"></label>
  <label>日付 <input type="date" id="date"></label>
  <label>項目
    <select id="category">
      <option>交通費</option>
      <option>飲食費</option>
      <option>消耗品</option>
      <option>会議費</option>
      <option>その他</option>
    </select>
  </label>
  <label>金額 (円) <input type="number" id="amount" min="0"></label>
  <label>メモ <textarea id="memo" rows="2"></textarea></label>
  <div class="actions">
    <button id="submitBtn" onclick="submitExpense()">記録する</button>
    <button class="secondary" onclick="logout()">ログアウト</button>
  </div>
  <div id="statusMsg"></div>
  <p class="note">記録されたデータは管理者のスプレッドシートに自動保存されます。<br>
     入力者名は毎回入力するか、ブラウザに記憶されます。</p>
</div>

<script>
  const PASSWORD = "keihi";
  const GAS_URL = "https://script.google.com/macros/s/AKfycbz35nqhB8SnzW0czjdoy3SmrDQjsZh2fiANTwzzMPxB4HtlhfQjNYSE4jZbvrKKywoU/exec";

  // 入力者名を記憶
  window.addEventListener('DOMContentLoaded', () => {
    const savedName = localStorage.getItem('userName');
    if (savedName) document.getElementById('userName').value = savedName;
    // 日付の初期値を今日に
    const today = new Date().toISOString().slice(0,10);
    document.getElementById('date').value = today;
  });

  function checkPassword() {
    const input = document.getElementById('passwordInput').value;
    if (input === PASSWORD) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
      sessionStorage.setItem('auth', '1');
    } else {
      document.getElementById('loginError').textContent = 'パスワードが違います。';
    }
  }

  function logout() {
    sessionStorage.removeItem('auth');
    location.reload();
  }

  function showStatus(msg, isError) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = isError ? 'error' : 'success';
  }

  async function submitExpense() {
    const name = document.getElementById('userName').value.trim();
    const date = document.getElementById('date').value;
    const category = document.getElementById('category').value;
    const amount = document.getElementById('amount').value;
    const memo = document.getElementById('memo').value.trim();

    if (!name || !date || !amount) {
      showStatus('入力者名・日付・金額は必須です。', true);
      return;
    }

    localStorage.setItem('userName', name);

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '送信中...';
    showStatus('', false);

    try {
      // GASにPOST送信（CORS回避のためtext/plainで送る）
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ name, date, category, amount, memo }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      });
      const json = await res.json();
      if (json.result === 'ok') {
        showStatus('✅ 記録しました！', false);
        document.getElementById('amount').value = '';
        document.getElementById('memo').value = '';
      } else {
        showStatus('エラー: ' + (json.message || '不明なエラー'), true);
      }
    } catch (err) {
      showStatus('送信失敗: ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = '記録する';
    }
  }

  if (sessionStorage.getItem('auth') === '1') {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainScreen').classList.remove('hidden');
  }
  document.getElementById('passwordInput')?.addEventListener('keypress', e => {
    if (e.key === 'Enter') checkPassword();
  });
</script>
</body>
</html>
